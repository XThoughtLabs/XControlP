name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Repository checks (Python compiles, no data files, JSON parses)
        run: python -B tools/check_repo.py
      - name: Day plan checks
        run: python -B day_test.py
      - name: Oracle (sample data, fixed date)
        run: python -B tests/oracle/run_oracle.py check
